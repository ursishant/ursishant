<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="35%" stop-color="#1E1B4B" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <radialGradient id="auroraGlow" cx="65%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshViolet" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#312E81" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="20" fill="#0B0F17" />

  <!-- Smooth Mesh Liquid Gradient Layers -->
  <rect width="1200" height="320" rx="20" fill="url(#meshGrad)" opacity="0.65" />
  <circle cx="780" cy="90" r="260" fill="url(#auroraGlow)" filter="url(#blurFilter)" />
  <circle cx="280" cy="240" r="220" fill="url(#meshViolet)" filter="url(#blurFilter)" />

  <!-- Subtle Organic Wave Contour -->
  <path d="M 0,210 C 320,290 560,140 880,230 C 1040,270 1140,240 1200,220 L 1200,320 L 0,320 Z" fill="#0B0F17" opacity="0.8" />

  <!-- Content Section -->
  <g transform="translate(64, 120)">
    <!-- Badge -->
    <rect x="0" y="0" width="138" height="28" rx="14" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <text x="69" y="18" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">FOUNDER &amp; DESIGNER</text>

    <!-- Name Heading -->
    <text x="0" y="68" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">Ishant Sharma</text>

    <!-- Subtitle -->
    <text x="0" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2">Architecting fluid, zero-friction software systems at <tspan fill="#38BDF8" font-weight="600">Pennion</tspan>.</text>
  </g>
</svg>
