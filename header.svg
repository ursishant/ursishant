<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @keyframes orbit-cyan {
        0%   { cx: 80px;  cy: 60px;  r: 280px; opacity: 0.85; }
        33%  { cx: 950px; cy: 80px;  r: 340px; opacity: 0.70; }
        66%  { cx: 650px; cy: 280px; r: 300px; opacity: 0.80; }
        100% { cx: 80px;  cy: 60px;  r: 280px; opacity: 0.85; }
      }
      @keyframes orbit-violet {
        0%   { cx: 1100px; cy: 260px; r: 320px; opacity: 0.80; }
        33%  { cx: 200px;  cy: 280px; r: 280px; opacity: 0.75; }
        66%  { cx: 1050px; cy: 70px;  r: 350px; opacity: 0.85; }
        100% { cx: 1100px; cy: 260px; r: 320px; opacity: 0.80; }
      }
      @keyframes orbit-perfume {
        0%   { cx: 600px; cy: 40px;  r: 240px; opacity: 0.65; }
        50%  { cx: 450px; cy: 220px; r: 290px; opacity: 0.55; }
        100% { cx: 600px; cy: 40px;  r: 240px; opacity: 0.65; }
      }

      .node-cyan {
        animation: orbit-cyan 12s ease-in-out infinite;
      }
      .node-violet {
        animation: orbit-violet 14s ease-in-out infinite;
      }
      .node-perfume {
        animation: orbit-perfume 10s ease-in-out infinite;
      }
    </style>

    <!-- Wellbeing Exact Color Palette (Aquamarine, Electric Violet, Soft Perfume Lavender) -->
    <radialGradient id="gradCyan">
      <stop offset="0%" stop-color="#5fffe1" stop-opacity="1" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="gradViolet">
      <stop offset="0%" stop-color="#bb29f2" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="gradPerfume">
      <stop offset="0%" stop-color="#e8bcfd" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Organic Blur for Liquid Mesh Look -->
    <filter id="meshBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="65" result="blur" />
    </filter>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fffe1" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#bb29f2" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#5fffe1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Container -->
  <rect width="1200" height="340" rx="24" fill="#07090E" />

  <!-- The Animated Wellbeing Mesh Fluid Field -->
  <g filter="url(#meshBlur)">
    <!-- Base subtle ambient fill -->
    <rect width="1200" height="340" rx="24" fill="#0C0F17" />
    
    <!-- Moving Color Blobs -->
    <circle class="node-cyan" cx="80" cy="60" r="280" fill="url(#gradCyan)" />
    <circle class="node-violet" cx="1100" cy="260" r="320" fill="url(#gradViolet)" />
    <circle class="node-perfume" cx="600" cy="40" r="240" fill="url(#gradPerfume)" />
  </g>

  <!-- Glass Inner Glow Vignette -->
  <rect width="1200" height="340" rx="24" fill="none" stroke="url(#glassBorder)" stroke-width="1.5" />

  <!-- Dark Translucent Overlay to keep typography crisp and readable -->
  <rect x="0" y="0" width="1200" height="340" rx="24" fill="#07090E" fill-opacity="0.45" />

  <!-- Sleek Minimalist Typography Overlay -->
  <g transform="translate(68, 115)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="146" height="28" rx="14" fill="#5fffe1" fill-opacity="0.12" stroke="#5fffe1" stroke-opacity="0.4" stroke-width="1" />
    <text x="73" y="18" fill="#5fffe1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" text-anchor="middle">FOUNDER &amp; DESIGNER</text>

    <!-- Main Title -->
    <text x="0" y="74" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-size="48" font-weight="800" letter-spacing="-1.5">Ishant Sharma</text>

    <!-- Clean Bio Line -->
    <text x="0" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2">Architecting fluid, human-centric software &amp; applied systems at <tspan fill="#5fffe1" font-weight="600">Pennion</tspan>.</text>
  </g>
</svg>
