<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatMesh1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(140px, 35px) scale(1.12); }
      }
      @keyframes floatMesh2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-130px, -25px) scale(1.15); }
      }
      @keyframes floatMesh3 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(70px, -45px) scale(0.92); }
      }
      @keyframes beaconPulse {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #5FFFE1); }
        50% { opacity: 0.35; filter: drop-shadow(0 0 1px #5FFFE1); }
      }

      .mesh-1 { animation: floatMesh1 16s ease-in-out infinite; }
      .mesh-2 { animation: floatMesh2 19s ease-in-out infinite; }
      .mesh-3 { animation: floatMesh3 13s ease-in-out infinite; }
      .beacon { animation: beaconPulse 2s ease-in-out infinite; }

      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .display { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, -system-ui, sans-serif; }
      .serif { font-family: "New York", Georgia, Cambria, "Times New Roman", serif; font-style: italic; }
    </style>

    <!-- MSHR Wellbeing Exact Palette: Aquamarine (#5FFFE1), Electric Violet (#BB29F2), Perfume Lilac (#E8BCFD) -->
    <radialGradient id="meshAqua" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5FFFE1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06080D" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BB29F2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#9333EA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06080D" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshPerfume" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8BCFD" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06080D" stop-opacity="0" />
    </radialGradient>

    <!-- Stretched Ambient Liquid Diffusion Filter -->
    <filter id="liquidGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="75" result="blur" />
    </filter>

    <!-- Subtle Beveled Glass Chamfer Border -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FFFE1" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#BB29F2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Deep Dark Outer Canvas -->
  <rect width="1000" height="440" rx="20" fill="#06080D" />

  <!-- Animated MSHR Wellbeing Liquid Mesh Field -->
  <g filter="url(#liquidGlow)" opacity="0.92">
    <g class="mesh-1">
      <ellipse cx="200" cy="110" rx="340" ry="200" fill="url(#meshAqua)" />
    </g>
    <g class="mesh-2">
      <ellipse cx="820" cy="330" rx="380" ry="240" fill="url(#meshViolet)" />
    </g>
    <g class="mesh-3">
      <ellipse cx="640" cy="130" rx="260" ry="170" fill="url(#meshPerfume)" />
    </g>
    <g class="mesh-1">
      <ellipse cx="380" cy="380" rx="280" ry="160" fill="url(#meshAqua)" opacity="0.5" />
    </g>
  </g>

  <!-- Editorial Card Container (Homage to Pin 3) -->
  <rect x="18" y="18" width="964" height="404" rx="16" fill="#080C14" fill-opacity="0.84" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" fill="#94A3B8" class="mono" font-size="11" font-weight="600" letter-spacing="1.5">&bull; PRODUCT DESIGNER &amp; BUILDER</text>
    <text x="452" y="0" fill="#64748B" class="mono" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">&bull; SWEAT THE DETAILS</text>
    <text x="904" y="0" fill="#94A3B8" class="mono" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="end">&bull; NEW DELHI, IN</text>
  </g>

  <!-- Hairline Divider -->
  <line x1="48" y1="68" x2="952" y2="68" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Identity Block -->
  <g transform="translate(48, 116)">
    <text x="0" y="0" fill="#64748B" class="mono" font-size="12" font-weight="600" letter-spacing="2.5">MY NAME IS</text>
    <text x="0" y="60" fill="#FFFFFF" class="display" font-size="62" font-weight="800" letter-spacing="-2.5">ISHANT SHARMA</text>
  </g>

  <!-- Big Statement -->
  <g transform="translate(48, 240)">
    <text x="0" y="0" fill="#F1F5F9" class="display" font-size="28" font-weight="500" letter-spacing="-0.8">
      I design software that <tspan class="serif" fill="#5FFFE1" font-weight="400">gets out of your way.</tspan>
    </text>
    <text x="0" y="32" fill="#94A3B8" class="display" font-size="15" font-weight="400" letter-spacing="-0.2">
      Founder at Pennion &bull; Building AirBridge, zero-friction local continuity between Apple &amp; Android.
    </text>
  </g>

  <!-- Bottom Navigation & Status Strip -->
  <g transform="translate(48, 342)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#5FFFE1" fill-opacity="0.08" stroke="#5FFFE1" stroke-opacity="0.28" stroke-width="1" />
    <circle class="beacon" cx="18" cy="16" r="3.5" fill="#5FFFE1" />
    <text x="32" y="20" fill="#5FFFE1" class="mono" font-size="10.5" font-weight="600" letter-spacing="1.2">OPEN TO GOOD PROBLEMS &amp; CRAFT</text>

    <text x="904" y="21" fill="#F8FAFC" class="mono" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="end">SELECTED WORK &darr;</text>
  </g>
</svg>
