<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatAqua {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(220px, 60px) scale(1.15); }
        66% { transform: translate(90px, 160px) scale(0.92); }
      }
      @keyframes floatViolet {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(-180px, -50px) scale(1.12); }
        66% { transform: translate(-280px, 70px) scale(0.96); }
      }
      @keyframes floatLilac {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(140px, -90px) scale(1.18); }
      }
      @keyframes floatIndigo {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-120px, 110px) scale(1.08); }
      }
      @keyframes beaconPulse {
        0% { r: 3.5px; opacity: 1; }
        50% { r: 8.5px; opacity: 0; }
        100% { r: 3.5px; opacity: 1; }
      }

      .node-aqua   { animation: floatAqua 18s ease-in-out infinite; }
      .node-violet { animation: floatViolet 22s ease-in-out infinite; }
      .node-lilac  { animation: floatLilac 16s ease-in-out infinite; }
      .node-indigo { animation: floatIndigo 20s ease-in-out infinite; }
      .beacon-ring { animation: beaconPulse 2.8s ease-out infinite; }

      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      .display {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, -system-ui, sans-serif;
      }
    </style>

    <!-- MSHR Wellbeing Palette: Black, Aquamarine, Perfume, Electric Violet -->
    <radialGradient id="meshAqua" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5FFFE1" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#2DD4BF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#04060A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#9333EA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#04060A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshLilac" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0ABFC" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#E879F9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#04060A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1E1B4B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#04060A" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Liquid Diffusion Filter -->
    <filter id="mshrBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>

    <!-- Obsidian Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="80%" stop-color="#5FFFE1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Deep Abyss Canvas -->
  <rect width="1200" height="420" rx="24" fill="#04060A" />

  <!-- Animated Wellbeing MSHR Liquid Glow Field -->
  <g filter="url(#mshrBlur)" opacity="0.95">
    <rect width="1200" height="420" fill="#05070C" />
    <g class="node-aqua">
      <ellipse cx="160" cy="110" rx="320" ry="240" fill="url(#meshAqua)" />
    </g>
    <g class="node-violet">
      <ellipse cx="1040" cy="310" rx="360" ry="260" fill="url(#meshViolet)" />
    </g>
    <g class="node-lilac">
      <ellipse cx="860" cy="90" rx="280" ry="200" fill="url(#meshLilac)" />
    </g>
    <g class="node-indigo">
      <ellipse cx="360" cy="330" rx="300" ry="220" fill="url(#meshIndigo)" />
    </g>
  </g>

  <!-- Subtle Atmospheric Darkness Mask -->
  <rect width="1200" height="420" rx="24" fill="#04060A" fill-opacity="0.45" />

  <!-- Obsidian Glass Panel -->
  <g transform="translate(40, 40)">
    <rect width="1120" height="340" rx="20" fill="#080C14" fill-opacity="0.62" stroke="url(#cardBorder)" stroke-width="1.2" />

    <!-- Status Beacon -->
    <g transform="translate(44, 40)">
      <circle cx="5" cy="5" r="3.5" fill="#5FFFE1" />
      <circle class="beacon-ring" cx="5" cy="5" r="3.5" fill="none" stroke="#5FFFE1" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="22" y="9" fill="#94A3B8" class="mono" font-size="12" font-weight="500" letter-spacing="1">DESIGN &amp; SYSTEMS ARCHITECTURE</text>
    </g>

    <!-- Heading: Name -->
    <g transform="translate(44, 126)">
      <text x="0" y="0" fill="url(#nameGradient)" class="display" font-size="52" font-weight="800" letter-spacing="-1.8">Ishant Sharma</text>
      <text x="0" y="38" fill="#5FFFE1" class="mono" font-size="13" font-weight="600" letter-spacing="1.5">FOUNDER AT PENNION  ·  BUILDER OF AIRBRIDGE</text>
    </g>

    <!-- Editorial Lead Line -->
    <g transform="translate(44, 226)">
      <text x="0" y="0" fill="#E2E8F0" class="display" font-size="18" font-weight="500" letter-spacing="-0.3">
        Designing quiet, zero-friction software across Apple &amp; Android hardware ecosystems.
      </text>
      <text x="0" y="28" fill="#94A3B8" class="display" font-size="14" font-weight="400" letter-spacing="-0.2">
        Focused on local-first P2P continuity, bespoke design systems, and applied creative tooling.
      </text>
    </g>

    <!-- Bottom Architectural Tags -->
    <g transform="translate(44, 290)">
      <rect x="0" y="0" width="138" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="12" y="17" fill="#E2E8F0" class="mono" font-size="11" font-weight="500">AIRBRIDGE P2P</text>

      <rect x="148" y="0" width="134" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="160" y="17" fill="#C084FC" class="mono" font-size="11" font-weight="500">PENNION LABS</text>

      <rect x="292" y="0" width="168" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="304" y="17" fill="#5FFFE1" class="mono" font-size="11" font-weight="500">LOCAL-FIRST PROTOCOLS</text>
    </g>
  </g>
</svg>
