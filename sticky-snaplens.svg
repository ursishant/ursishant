<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, -system-ui, sans-serif; }
    </style>
    <filter id="stickyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <g transform="translate(18, 16) rotate(1.8 212 149)">
    <!-- Sticky Note Body (Pastel Pink) -->
    <g filter="url(#stickyShadow)">
      <rect width="424" height="298" rx="4" fill="#F8DDEB" />
      <path d="M 388 298 L 424 262 L 388 262 Z" fill="#EC4899" />
    </g>

    <rect x="162" y="-10" width="100" height="24" rx="2" fill="url(#tapeGrad)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8" transform="rotate(-1.2 212 2)" />

    <g transform="translate(26, 32)">
      <text x="0" y="0" fill="#BE185D" class="mono" font-size="10" font-weight="700" letter-spacing="1.2">STICKY 04 &bull; CREATIVE TECH</text>
      <text x="372" y="0" fill="#DB2777" class="mono" font-size="10" font-weight="700" letter-spacing="1" text-anchor="end">75M+ PLAYS</text>

      <line x1="0" y1="10" x2="372" y2="10" stroke="#F43F5E" stroke-opacity="0.35" stroke-width="1" />

      <text x="0" y="38" fill="#831843" class="sans" font-size="28" font-weight="900" letter-spacing="-0.8">SnapLensStudio</text>
      <text x="0" y="58" fill="#9D174D" class="sans" font-size="12" font-weight="600">Augmented reality experiments that went a bit too far</text>

      <rect x="-4" y="74" width="380" height="42" rx="4" fill="#FBCFE8" fill-opacity="0.6" />
      <text x="8" y="93" fill="#831843" class="sans" font-size="12" font-weight="700">"crossed 75,000,000+ organic plays.</text>
      <text x="8" y="108" fill="#831843" class="sans" font-size="12" font-weight="700">still sounds unreal every single time I type it."</text>

      <g transform="translate(0, 138)">
        <text x="0" y="0" fill="#BE185D" class="mono" font-size="11" font-weight="700">&bull;</text>
        <text x="14" y="0" fill="#831843" class="sans" font-size="12" font-weight="500">75M+ viral impressions worldwide on Snapchat</text>

        <text x="0" y="20" fill="#BE185D" class="mono" font-size="11" font-weight="700">&bull;</text>
        <text x="14" y="20" fill="#831843" class="sans" font-size="12" font-weight="500">Playful creative tech &bull; AR camera interactions</text>

        <text x="0" y="40" fill="#BE185D" class="mono" font-size="11" font-weight="700">&bull;</text>
        <text x="14" y="40" fill="#831843" class="sans" font-size="12" font-weight="500">Proof that side ideas can reach millions</text>
      </g>

      <g transform="translate(0, 218)">
        <text x="0" y="0" fill="#BE185D" class="mono" font-size="10.5" font-weight="800" letter-spacing="0.8">TAP NOTE TO EXPLORE EXPERIMENTS &rarr;</text>
      </g>
    </g>
  </g>
</svg>
