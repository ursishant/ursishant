<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, -system-ui, sans-serif; }
    </style>
    <filter id="stickyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <g transform="translate(18, 16) rotate(2.2 212 149)">
    <!-- Sticky Note Body (Mint Green) -->
    <g filter="url(#stickyShadow)">
      <rect width="424" height="298" rx="4" fill="#DDF2DD" />
      <path d="M 388 298 L 424 262 L 388 262 Z" fill="#22C55E" />
    </g>

    <rect x="162" y="-10" width="100" height="24" rx="2" fill="url(#tapeGrad)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8" transform="rotate(-1.5 212 2)" />

    <g transform="translate(26, 32)">
      <text x="0" y="0" fill="#15803D" class="mono" font-size="10" font-weight="700" letter-spacing="1.2">STICKY 02 &bull; LEGAL TECH</text>
      <text x="372" y="0" fill="#16A34A" class="mono" font-size="10" font-weight="700" letter-spacing="1" text-anchor="end">ACCESSIBILITY</text>

      <line x1="0" y1="10" x2="372" y2="10" stroke="#16A34A" stroke-opacity="0.35" stroke-width="1" />

      <text x="0" y="38" fill="#064E3B" class="sans" font-size="28" font-weight="900" letter-spacing="-0.8">NyayaShastra</text>
      <text x="0" y="58" fill="#14532D" class="sans" font-size="12" font-weight="600">Indian legal documents made genuinely understandable</text>

      <rect x="-4" y="74" width="380" height="42" rx="4" fill="#BBF7D0" fill-opacity="0.6" />
      <text x="8" y="93" fill="#064E3B" class="sans" font-size="12" font-weight="700">"because reading legal documents shouldn't</text>
      <text x="8" y="108" fill="#064E3B" class="sans" font-size="12" font-weight="700">feel like decoding ancient manuscripts."</text>

      <g transform="translate(0, 138)">
        <text x="0" y="0" fill="#15803D" class="mono" font-size="11" font-weight="700">&bull;</text>
        <text x="14" y="0" fill="#064E3B" class="sans" font-size="12" font-weight="500">Plain-language legal explanations for citizens</text>

        <text x="0" y="20" fill="#15803D" class="mono" font-size="11" font-weight="700">&bull;</text>
        <text x="14" y="20" fill="#064E3B" class="sans" font-size="12" font-weight="500">Useful document tools &amp; simplified statutory guides</text>

        <text x="0" y="40" fill="#15803D" class="mono" font-size="11" font-weight="700">&bull;</text>
        <text x="14" y="40" fill="#064E3B" class="sans" font-size="12" font-weight="500">Making complicated public systems radically simpler</text>
      </g>

      <g transform="translate(0, 218)">
        <text x="0" y="0" fill="#15803D" class="mono" font-size="10.5" font-weight="800" letter-spacing="0.8">TAP NOTE TO VISIT NYAYASHASTRA &rarr;</text>
      </g>
    </g>
  </g>
</svg>
