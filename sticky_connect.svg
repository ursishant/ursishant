<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "SF Mono", SFMono-Regular, "Google Sans Mono", ui-monospace, Menlo, Consolas, monospace; -webkit-font-smoothing: antialiased; }
      .sans { font-family: "SF Pro Display", "SF Pro Text", "Google Sans", "Product Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    </style>
    <filter id="stickyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <g transform="translate(18, 16) rotate(1.6 212 149)">
    <!-- Sticky Note Body (Pastel Peach) -->
    <g filter="url(#stickyShadow)">
      <rect width="424" height="298" rx="4" fill="#FFE5D2" />
      <path d="M 388 298 L 424 262 L 388 262 Z" fill="#EA580C" />
    </g>

    <rect x="162" y="-10" width="100" height="24" rx="2" fill="url(#tapeGrad)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8" transform="rotate(-1.8 212 2)" />

    <g transform="translate(26, 32)">
      <text x="0" y="0" fill="#C2410C" class="mono" font-size="10" font-weight="700" letter-spacing="1.2">STICKY 06 • LEAVE A NOTE</text>
      <text x="372" y="0" fill="#EA580C" class="mono" font-size="10" font-weight="700" letter-spacing="1" text-anchor="end">OPEN TO CHAT</text>

      <line x1="0" y1="10" x2="372" y2="10" stroke="#F97316" stroke-opacity="0.35" stroke-width="1" />

      <text x="0" y="38" fill="#7C2D12" class="sans" font-size="28" font-weight="900" letter-spacing="-0.8">Let's Connect</text>
      <text x="0" y="58" fill="#9A3412" class="sans" font-size="12" font-weight="600">Have an interesting idea or product worth exploring?</text>

      <rect x="-4" y="74" width="380" height="42" rx="4" fill="#FED7AA" fill-opacity="0.6" />
      <text x="8" y="93" fill="#7C2D12" class="sans" font-size="12" font-weight="700">"skip the generic 'hi'... tell me what you're</text>
      <text x="8" y="108" fill="#7C2D12" class="sans" font-size="12" font-weight="700">building or drop an unhinged design opinion."</text>

      <g transform="translate(0, 138)">
        <text x="0" y="0" fill="#C2410C" class="mono" font-size="11" font-weight="700">•</text>
        <text x="14" y="0" fill="#7C2D12" class="sans" font-size="12" font-weight="500">Portfolio: ursishant.netlify.app</text>

        <text x="0" y="20" fill="#C2410C" class="mono" font-size="11" font-weight="700">•</text>
        <text x="14" y="20" fill="#7C2D12" class="sans" font-size="12" font-weight="500">LinkedIn: linkedin.com/in/ursishant</text>

        <text x="0" y="40" fill="#C2410C" class="mono" font-size="11" font-weight="700">•</text>
        <text x="14" y="40" fill="#7C2D12" class="sans" font-size="12" font-weight="500">Twitter / X: @ursishant • Behance: /ursishant</text>
      </g>

      <g transform="translate(0, 218)">
        <text x="0" y="0" fill="#C2410C" class="mono" font-size="10.5" font-weight="800" letter-spacing="0.8">TAP NOTE TO SEND A MESSAGE →</text>
      </g>
    </g>
  </g>
</svg>
